<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Parachute" />
  <meta name="theme-color" content="#FFD54F" />
  <title>The Parachute</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    :root{ --bg:#8BC34A; --yellow:#FFD54F; --border:#000; --plus:#3B8F1E; --minus:#D93025; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; }
    body{
      background:var(--bg); color:#111;
      font-family:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
    button:focus-visible{ outline:4px solid #1565c0; outline-offset:2px; }
    .app{ min-height:100%; display:flex; flex-direction:column; }
    header{
      position:sticky; top:0; z-index:5; background:var(--yellow); border-bottom:5px solid var(--border);
      padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
      display:flex; align-items:center; gap:10px; min-height:58px;
    }
    header h1{ margin:0; font-size:1.35rem; font-weight:900; flex:1; display:flex; align-items:center; gap:8px; }
    .back{ border:3px solid var(--border); background:#fff; border-radius:12px; padding:6px 12px; font-weight:900; font-size:1rem; }
    .who-chip{ border:3px solid var(--border); background:#fff; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.85rem; }
    .pending-chip{ border:3px solid var(--border); background:#fff; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.8rem; white-space:nowrap; }
    .pending-chip.stuck{ background:#FFB74D; }
    .chip{ color:#fff; border-radius:999px; padding:2px 14px; font-weight:900; }
    main{ flex:1; padding:14px; max-width:560px; width:100%; margin:0 auto; }
    .hint{ font-weight:800; margin:2px 2px 12px; color:#173404; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .student{
      border:4px solid var(--border); border-radius:18px; min-height:92px; color:#fff;
      font-size:1.8rem; font-weight:900; letter-spacing:.02em;
    }
    .student:active, .pm:active, .big:active{ transform:scale(.97); }
    .rows{ display:flex; flex-direction:column; gap:12px; }
    .row{
      display:grid; grid-template-columns:72px 1fr 72px; min-height:78px;
      border:4px solid var(--border); border-radius:16px; overflow:hidden; background:#fff;
    }
    .pm{ border:0; color:#fff; font-size:2.2rem; font-weight:900; line-height:1; }
    .pm.minus{ background:var(--minus); }
    .pm.plus{ background:var(--plus); }
    .pm:disabled{ opacity:.35; }
    .mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px 6px; }
    .mid .name{ font-weight:800; font-size:1rem; line-height:1.15; }
    .mid .val{ font-weight:900; font-size:1.5rem; font-variant-numeric:tabular-nums; }
    .row.has .mid{ background:#FFF1B8; }
    footer{
      position:sticky; bottom:0; background:var(--yellow); border-top:5px solid var(--border);
      padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px;
    }
    .when{
      display:flex; align-items:center; gap:10px; background:#fff; border:4px solid var(--border);
      border-radius:14px; padding:4px 12px; min-height:52px; font-weight:900;
    }
    .when-label{ font-size:1.05rem; }
    .when input{
      font:inherit; font-weight:900; font-size:1.3rem; border:0; background:transparent; color:#111;
      min-width:0; flex:0 1 auto; padding:4px 0;
    }
    .when input:focus-visible{ outline:3px solid #1565c0; border-radius:6px; }
    .when-hint{ margin-left:auto; font-size:.8rem; font-weight:800; color:#555; white-space:nowrap; }
    .when.edited{ background:#FFF1B8; }
    .when.edited .when-hint{ color:#7a4b00; }
    .toggle{ display:grid; grid-template-columns:1fr 1fr; border:4px solid var(--border); border-radius:14px; overflow:hidden; }
    .toggle button{ border:0; background:#fff; font-weight:900; font-size:1.1rem; min-height:50px; }
    .toggle button[aria-pressed="true"]{ background:#111; color:#fff; }
    .actions{ display:grid; grid-template-columns:1fr 1.5fr; gap:10px; }
    .big{ border:4px solid var(--border); border-radius:14px; min-height:58px; font-weight:900; font-size:1.2rem; }
    .cancel{ background:#fff; }
    .submit{ background:#2E7D32; color:#fff; }
    .submit:disabled{ background:#c9d6c9; color:#555; }
    .pick{ display:flex; flex-direction:column; gap:12px; }
    .pick .big{ background:#fff; min-height:72px; font-size:1.4rem; }
    .launch{ display:flex; flex-direction:column; gap:12px; }
    .tile{
      display:flex; align-items:center; gap:14px; text-align:left; width:100%;
      border:4px solid var(--border); border-radius:18px; min-height:92px; padding:12px 16px; color:#fff;
    }
    .tile svg{ flex-shrink:0; }
    .tile .t-name{ display:block; font-size:1.45rem; font-weight:900; line-height:1.1; }
    .tile .t-sub{ display:block; font-size:.95rem; font-weight:800; opacity:.92; margin-top:2px; }
    .tile.behavior{ background:#D93025; }
    .tile.show{ background:#6A1B9A; text-decoration:none; }
    .tile.soon{ background:#fff; color:#555; border-style:dashed; min-height:72px; cursor:default; }
    .tile.soon .t-name{ font-size:1.15rem; color:#333; }
    .tile.goals{ background:#1565C0; }
    .goal-list{ display:flex; flex-direction:column; gap:10px; }
    .goal-row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; border:4px solid var(--border); border-radius:16px; padding:12px 14px; min-height:72px; }
    .goal-row .g-name{ display:block; font-size:1.15rem; font-weight:900; line-height:1.2; }
    .goal-row .g-sub{ display:block; font-size:.9rem; font-weight:800; color:#444; margin-top:2px; }
    .goal-row .arrow{ margin-left:auto; font-size:1.6rem; font-weight:900; }
    .g-card{ background:#fff; border:4px solid var(--border); border-radius:16px; padding:10px 14px; margin-bottom:12px; }
    .g-card .g-name{ font-size:1.2rem; font-weight:900; line-height:1.2; }
    .g-card .g-sub{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; font-weight:800; color:#444; }
    .g-card .g-sub b{ font-size:1.4rem; color:#111; }
    .strip{ display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:4px; margin-bottom:12px; }
    .strip i{ height:36px; border:3px solid #5E8A2C; border-radius:8px; background:#A5D46B; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:900; font-size:.95rem; }
    .strip i.ok{ background:var(--plus); border-color:#000; color:#fff; }
    .strip i.help{ background:#FFF1B8; border-color:#000; color:#111; }
    .strip i.no{ background:var(--minus); border-color:#000; color:#fff; }
    .strip i.next{ background:#fff; border:3px dashed #000; }
    .ans{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .ans button{ min-height:130px; border:4px solid var(--border); border-radius:18px; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    .ans .big-mark{ font-size:3.4rem; font-weight:900; line-height:1; }
    .ans .lab{ font-size:1.15rem; font-weight:900; }
    .ans .yes{ background:var(--plus); } .ans .no{ background:var(--minus); }
    .help-label{ font-weight:900; color:#173404; margin:4px 2px 6px; }
    .helps{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); border:4px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; margin-bottom:12px; }
    .helps button{ border:0; border-left:3px solid #000; background:#fff; min-height:54px; font-weight:900; font-size:.95rem; padding:0 2px; line-height:1.05; }
    .helps button:first-child{ border-left:0; }
    .helps button[aria-pressed="true"]{ background:#111; color:#fff; }
    .helps.big button{ min-height:84px; font-size:1.05rem; }
    .stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; text-align:center; background:#fff; border:4px solid var(--border); border-radius:16px; padding:8px; }
    .stats b{ display:block; font-size:1.4rem; font-weight:900; }
    .stats span{ font-size:.8rem; font-weight:800; color:#444; }
    .counter{ display:grid; grid-template-columns:96px 1fr 96px; border:4px solid var(--border); border-radius:18px; overflow:hidden; background:#fff; min-height:130px; margin-bottom:12px; }
    .counter .num{ display:flex; align-items:center; justify-content:center; font-size:3.2rem; font-weight:900; font-variant-numeric:tabular-nums; }
    .clock{ background:#fff; border:4px solid var(--border); border-radius:18px; text-align:center; padding:16px; margin-bottom:12px; }
    .clock .num{ font-size:3.4rem; font-weight:900; font-variant-numeric:tabular-nums; }
    .clock button{ margin-top:8px; width:100%; }
    .go-btn{ background:var(--plus); color:#fff; } .stop-btn{ background:var(--minus); color:#fff; }
    .check-wrap{ position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; }
    .check-wrap[hidden]{ display:none; }
    .check{ width:100%; max-width:560px; margin:0 auto; background:var(--yellow); border-top:5px solid #000; border-radius:24px 24px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; }
    .check .saved{ background:#fff; border:4px solid #000; border-radius:14px; padding:8px 12px; font-weight:900; }
    .check .q-goal{ font-weight:900; color:#0D47A1; font-size:.95rem; }
    .check .q{ font-size:1.6rem; font-weight:900; line-height:1.15; }
    .check .big{ min-height:62px; }
    .check .b-yes{ background:#2E7D32; color:#fff; } .check .b-help{ background:#1565C0; color:#fff; } .check .b-no{ background:#fff; }
    .check .skip{ border:0; background:transparent; font-weight:800; text-decoration:underline; min-height:44px; }
    .tgts{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .tgts button{ border:3px solid #000; background:#fff; border-radius:999px; min-height:48px; padding:0 16px; font-weight:900; font-size:1.05rem; }
    .tgts button[aria-pressed="true"]{ background:#111; color:#fff; }
    .strip i small{ font-size:.6rem; font-weight:900; display:block; line-height:1; overflow:hidden; max-width:100%; white-space:nowrap; }
    .pick-grid{ display:flex; flex-wrap:wrap; gap:8px; }
    .pick-grid button{ border:4px solid #000; background:#fff; border-radius:14px; min-height:56px; padding:0 18px; font-weight:900; font-size:1.1rem; }
    .tile.link{ background:#BF360C; text-decoration:none; }
    .tile.link .ext{ margin-left:auto; font-size:1.4rem; font-weight:900; }
    #linkTiles:empty{ display:none; }
    .tile.mydata{ background:#111; }
    .d-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
    .d-top .when{ font-weight:800; color:#173404; }
    .d-btn{ border:3px solid #000; background:#fff; border-radius:12px; min-height:44px; padding:0 14px; font-weight:900; }
    .d-h{ font-size:1.25rem; font-weight:900; margin:16px 2px 8px; color:#111; }
    .flag{ background:#fff; border:4px solid #000; border-left-width:12px; border-radius:14px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; }
    .flag .who, .s-card .who{ flex:none; border:3px solid #000; border-radius:999px; padding:2px 10px; font-weight:900; font-size:.9rem; }
    .flag .what{ font-weight:800; line-height:1.3; }
    .flag .tag{ display:block; font-size:.75rem; font-weight:900; letter-spacing:.04em; text-transform:uppercase; margin-bottom:2px; }
    .flag.up{ border-left-color:#D93025; } .flag.up .tag{ color:#B3261E; }
    .flag.stuck{ border-left-color:#E65100; } .flag.stuck .tag{ color:#A84300; }
    .flag.pattern{ border-left-color:#6A1B9A; } .flag.pattern .tag{ color:#6A1B9A; }
    .flag.quiet{ border-left-color:#757575; } .flag.quiet .tag{ color:#555; }
    .flag.mastered{ border-left-color:#2E7D32; } .flag.mastered .tag{ color:#1E6B2E; }
    .flag.down{ border-left-color:#1565C0; } .flag.down .tag{ color:#0D47A1; }
    .s-card{ background:#fff; border:4px solid #000; border-radius:16px; margin-bottom:10px; overflow:hidden; }
    .s-card summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:52px; font-weight:900; font-size:1.15rem; cursor:pointer; }
    .s-card summary::-webkit-details-marker{ display:none; }
    .s-card summary .chev{ margin-left:auto; }
    .s-card[open] summary .chev{ transform:rotate(90deg); }
    .s-body{ border-top:3px solid #000; padding:8px 12px 12px; }
    .s-sub{ font-weight:900; color:#173404; margin:8px 0 4px; }
    .s-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #ddd; }
    .s-row:last-child{ border-bottom:0; }
    .s-row .nm{ flex:1; font-weight:800; line-height:1.2; }
    .s-row .nm small{ display:block; font-weight:700; color:#555; }
    .s-row .num{ font-weight:900; font-variant-numeric:tabular-nums; text-align:right; min-width:64px; }
    .s-row svg{ flex:none; }
    .empty-note{ color:#333; font-weight:700; }
    .d-stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:6px; text-align:center; }
    .d-stats div{ border:3px solid #000; border-radius:12px; padding:6px 2px; }
    .d-stats b{ display:block; font-size:1.4rem; font-weight:900; }
    .d-stats span{ font-size:.75rem; font-weight:800; color:#444; }
    .d-trips{ margin-top:8px; border-top:3px solid #000; }
    .d-trip{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #ddd; }
    .d-trip .tw{ flex:none; width:48px; font-size:.8rem; font-weight:800; color:#444; line-height:1.2; }
    .d-trip .what{ flex:1; font-weight:800; line-height:1.25; }
    .d-trip .what small{ display:block; font-weight:700; color:#666; font-size:.78rem; }
    .d-trip .pr{ flex:none; border:2px solid #000; border-radius:999px; padding:2px 8px; font-size:.75rem; font-weight:900; }
    .d-pick{ margin:6px 0 4px; }
    .d-pick summary{ list-style:none; display:inline-flex; align-items:center; gap:6px; border:3px solid #000; border-radius:12px; min-height:44px; padding:0 12px; font-weight:900; cursor:pointer; background:#FFF1B8; }
    .d-pick summary::-webkit-details-marker{ display:none; }
    .d-pick-box{ border:3px solid #000; border-radius:12px; margin-top:6px; padding:4px 8px; background:#fff; }
    .d-pick-box label{ display:flex; align-items:center; gap:10px; min-height:44px; font-weight:800; }
    .d-pick-box input{ width:22px; height:22px; accent-color:#2E7D32; }
    @media print{ .no-print{ display:none !important; } }
    .d-actions{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 8px; }
    #printArea{ display:none; }
    @media print{
      @page{ margin:0.5in; }
      body.printing{ background:#fff !important; }
      body.printing > *:not(#printArea){ display:none !important; }
      body.printing #printArea{ display:block; }
      #printArea{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color:#000; }
      .p-page{ break-after:page; }
      .p-page:last-child{ break-after:auto; }
      .p-head{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid #000; padding-bottom:6px; margin-bottom:10px; }
      .p-name{ font-size:22pt; font-weight:900; }
      .p-meta{ font-size:9pt; color:#333; font-weight:700; }
      #printArea .d-card{ border:2px solid #000; border-radius:8px; break-inside:avoid; margin-bottom:10px; }
      #printArea .d-card svg{ max-height:2.3in; }
      .p-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
      .p-grid > .d-card:first-child{ grid-column:1 / -1; }
      .p-grid > .d-card:first-child svg{ max-height:2in; }
      #printArea .d-card{ margin:0; padding:8px; }
      #printArea .d-table{ font-size:8pt; }
      #printArea .d-title{ font-size:11pt; } #printArea .d-big{ font-size:14pt; }
    }
    .d-students{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .d-students button{ border:3px solid #000; border-radius:999px; min-height:46px; padding:0 16px; font-weight:900; font-size:1.05rem; opacity:.55; }
    .d-students button[aria-pressed="true"]{ opacity:1; outline:4px solid #111; outline-offset:2px; }
    .d-card{ background:#fff; border:4px solid #000; border-radius:16px; padding:12px; margin-bottom:12px; }
    .d-title{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:1.15rem; font-weight:900; line-height:1.2; }
    .d-title small{ font-size:.8rem; color:#555; font-weight:800; margin-left:6px; }
    .d-big{ font-size:1.6rem; font-weight:900; white-space:nowrap; }
    .d-sub{ font-size:.85rem; font-weight:800; color:#555; margin:2px 0 6px; }
    .lg{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.85rem; font-weight:800; margin:4px 0 8px; }
    .lg span{ display:inline-flex; align-items:center; gap:6px; }
    .d-table{ width:100%; border-collapse:collapse; font-size:.9rem; margin-top:6px; }
    .d-table th{ text-align:left; font-weight:900; border-bottom:3px solid #000; padding:4px 6px; }
    .d-table td{ border-bottom:1px solid #ddd; padding:6px; font-weight:700; }
    .d-table small{ color:#555; }
    .soon-label{ font-weight:900; color:#173404; margin:8px 2px 0; }
    .msg{ background:#fff; border:4px solid var(--border); border-radius:16px; padding:16px; font-weight:800; text-align:center; }
    .toast{
      position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
      background:#111; color:#fff; font-weight:900; padding:12px 18px; border-radius:999px; max-width:92vw; text-align:center;
      box-shadow:0 4px 14px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20;
    }
    .toast.show{ opacity:1; }
    .toast.home{ bottom:calc(24px + env(safe-area-inset-bottom,0px)); }
    [hidden]{ display:none !important; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="btnBack" hidden aria-label="Go back">‹ Back</button>
    <h1 id="title">The Parachute</h1>
    <button class="pending-chip" id="pendingChip" hidden aria-label="Entries waiting to send. Tap to try now."></button>
    <button class="who-chip" id="btnWho" hidden aria-label="Change who is using this phone"></button>
  </header>

  <!-- First time only: who is using this phone -->
  <main id="screenWho" hidden>
    <p class="hint">Who's using this phone? (You'll only be asked once.)</p>
    <div class="pick" id="staffList"></div>
    <div class="msg" id="staffMsg" hidden></div>
  </main>

  <!-- Launchpad: the aide's home screen -->
  <main id="screenHome" hidden>
    <div class="launch">
      <button class="tile behavior" id="tileBehavior">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span><span class="t-name">Log a behavior</span><span class="t-sub">Count it with + and −</span></span>
      </button>
      <a class="tile show" href="pocket-kit.html">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/></svg>
        <span><span class="t-name">Show a student</span><span class="t-sub">Pocket Kit: timer, first/then, choices, cards</span></span>
      </a>
      <button class="tile goals" id="tileGoals">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
        <span><span class="t-name">Take goal data</span><span class="t-sub">Mark each try</span></span>
      </button>
      <div class="launch" id="linkTiles"></div>
      <button class="tile mydata" id="tileData" hidden>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span><span class="t-name">My data</span><span class="t-sub">Charts for each student · teacher PIN</span></span>
      </button>
      <p class="soon-label">Coming soon</p>
      <div class="tile soon" aria-disabled="true"><span><span class="t-name">Daily checklist</span><span class="t-sub">When you arrive and before you leave</span></span></div>
    </div>
  </main>

  <!-- Screen 1: students -->
  <main id="screenStudents" hidden>
    <p class="hint">Tap a student</p>

<script>
// ---- Connection (filled in once; the aides never see or change this) ----
// After deploying Code.gs as a web app, paste its URL between the quotes on the next line.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz3MkE3Ev39aRMZK9lkbcgRvSjt1HKmcz75D-PAJa-YOL0qQvZnkIs-2yK8IxQj3bs/exec";
const KEY = "skhqdkxwzat0zmt2qg"; // must match KEY in Code.gs

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let students = JSON.parse(store.get("parachute:students") || "[]");
let staff = JSON.parse(store.get("parachute:staff") || "[]");
let current = null;            // student being logged
let mode = "count";            // "count" | "min"
let tally = {};                // behavior -> { count, min }
let screenNow = "";

/* ---------- talking to the Sheet ---------- */
async function request(params){
  if (!ENDPOINT.startsWith("https://")) throw new Error("not-set-up");
  const url = new URL(ENDPOINT);
  Object.entries({ ...params, key: KEY }).forEach(([k, v]) => url.searchParams.set(k, v));
  let res;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  try { res = await fetch(url.toString(), { cache: "no-store", signal: ctl.signal }); }
  catch { throw new Error("no connection"); }
  finally { clearTimeout(timer); }
  let data;
  try { data = JSON.parse(await res.text()); } catch { throw new Error("Google error " + res.status); }
  if (!data.ok) throw new Error(data.error || "error");
  return data;
}

async function loadStudents(){
  try {
    const data = await request({ action: "setup" });
    students = data.students || [];
    staff = data.staff || [];
    store.set("parachute:students", JSON.stringify(students));
    store.set("parachute:staff", JSON.stringify(staff));
    links = data.links || [];
    teachers = data.teachers || [];
    store.set("parachute:teachers", JSON.stringify(teachers));
    showTeacherTile();
    store.set("parachute:links", JSON.stringify(links));
    $("studentsMsg").hidden = true;
  } catch (err) {
    if (!students.length) {
      $("studentsMsg").hidden = false;
      $("studentsMsg").textContent = !ENDPOINT.startsWith("https://")
        ? "Not connected to the Google Sheet yet. Mr. Tucker needs to finish setup."
        : err.message === "bad-key"
          ? "The connection key doesn't match the Sheet. Mr. Tucker needs to check setup."
          : "Can't load students. Check the internet connection and reopen the app.";
    }
  }
  renderStudents();
  renderStaff();
  renderLinks();
}

/* ---------- launchpad buttons for other apps (from the Links tab) ---------- */
let links = [];
try { links = JSON.parse(store.get("parachute:links") || "[]"); } catch (e) { links = []; }
function renderLinks(){
  const box = $("linkTiles"); box.innerHTML = "";
  links.forEach(l => {
    const a = document.createElement("a");
    a.className = "tile link";
    a.href = l.url;
    a.target = "_blank";       // opens on top, so closing it comes back here
    a.rel = "noopener";
    a.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span><span class="t-name"></span><span class="t-sub"></span></span>';
    a.querySelector(".t-name").textContent = l.name;
    a.querySelector(".t-sub").textContent = l.sub || "Opens in a new window";
    box.appendChild(a);
  });
}
renderLinks();

/* ---------- My data: teacher only, behind the teacher PIN ---------- */
let teachers = [];
try { teachers = JSON.parse(store.get("parachute:teachers") || "[]"); } catch (e) { teachers = []; }
const PIN_KEY = "parachute:pk:pin"; // same PIN memory as Pocket Kit's teacher unlock
function showTeacherTile(){ $("tileData").hidden = !teachers.includes(store.get("parachute:by") || ""); }
showTeacherTile();

$("tileData").addEventListener("click", () => {
  if (store.get(PIN_KEY)) openMyData();
  else { $("pinIn").value = ""; $("pinWrap").hidden = false; setTimeout(() => $("pinIn").focus(), 50); }
});
$("pinCancel").addEventListener("click", () => { $("pinWrap").hidden = true; });
$("pinGo").addEventListener("click", async () => {
  const pin = $("pinIn").value.trim(); if (!pin) return;
  $("pinGo").disabled = true; $("pinGo").textContent = "Checking…";
  try {
    await request({ action: "checkPin", pin });
    store.set(PIN_KEY, pin); $("pinWrap").hidden = true; openMyData();
  } catch (e) {
    toast(e.message === "bad-pin" ? "That PIN isn’t right" : e.message === "no-pin-set" ? "Set TEACHER_PIN in Code.gs first" : "Couldn’t check. Try again with internet.");
  } finally { $("pinGo").disabled = false; $("pinGo").textContent = "Open My data"; }
});

function openMyData(){
  $("toast").classList.remove("show");
  $("title").textContent = "My data";
  show("screenMyData");
  let cached = null; try { cached = JSON.parse(store.get("parachute:mydata") || "null"); } catch (e) {}
  if (cached) renderMyData(cached, true); else $("dataBody").innerHTML = '<p class="empty-note">Loading…</p>';
  loadMyData();
}
async function loadMyData(){
  try {
    const d = await request({ action: "myData", pin: store.get(PIN_KEY) || "" });
    d.loadedAt = Date.now();
    store.set("parachute:mydata", JSON.stringify(d));
    if (screenNow === "screenMyData") renderMyData(d, false);
  } catch (e) {
    if (e.message === "bad-pin") { store.set(PIN_KEY, ""); goLaunch(); toast("PIN changed. Tap My data and enter it again."); return; }
    if (screenNow === "screenMyData") toast("Couldn’t update. Showing what was saved last.");
  }
}

const escHtml = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LINE_STYLES = [["#1565C0", ""], ["#D93025", "6 4"], ["#2E7D32", "2 4"], ["#6A1B9A", "10 4 2 4"], ["#E65100", "4 2"], ["#00838F", "1 3"]];
const shortDate = d => { const p = String(d).split("-"); return p.length === 3 ? Number(p[1]) + "/" + Number(p[2]) : d; };
let dataStudent = "";
// which bathroom lines to chart (remembered on this phone)
const BATH_OPTIONS = [["pct", "% voided in toilet"], ["trips", "Trips"], ["voids", "Voided in toilet"], ["accidents", "Accidents"], ["bms", "BMs"]];
let bathSel = ["pct"];
try { const v = JSON.parse(store.get("parachute:bathsel") || "null"); if (Array.isArray(v)) bathSel = v; } catch (e) {}
let bathPickOpen = false;

/* a simple line chart drawn as SVG: labels along the bottom, one line per series */
function lineChart(labels, series, opts){
  const W = 340, H = 190, L = 34, R = 10, T = 10, B = 28;
  const pw = W - L - R, ph = H - T - B;
  const all = series.flatMap(s => s.values.filter(v => v !== null && v !== undefined));
  const yMax = opts.yMax || Math.max(4, Math.ceil(Math.max(0, ...all) * 1.15));
  const n = labels.length;
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const y = v => T + ph - (v / yMax) * ph;
  let g = "";
  const ticks = opts.yMax === 100 ? [0, 25, 50, 75, 100] : [0, Math.round(yMax / 2), yMax];
  ticks.forEach(t => {
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#E0E0E0" stroke-width="1"/>';
    g += '<text x="' + (L - 5) + '" y="' + (y(t) + 4) + '" font-size="10" text-anchor="end" fill="#444">' + t + (opts.unit === "%" ? "%" : "") + '</text>';
  });
  if (opts.goalLine) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(opts.goalLine) + '" y2="' + y(opts.goalLine) + '" stroke="#2E7D32" stroke-dasharray="5 4" stroke-width="1.5"/>' +
    '<text x="' + (W - R) + '" y="' + (y(opts.goalLine) - 4) + '" font-size="10" text-anchor="end" fill="#1E6B2E" font-weight="700">' + opts.goalLine + '% goal</text>';
  const every = Math.max(1, Math.ceil(n / 6));
  labels.forEach((lab, i) => { if (i % every === 0 || i === n - 1) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#444">' + escHtml(lab) + '</text>'; });
  g += '<line x1="' + L + '" x2="' + L + '" y1="' + T + '" y2="' + (T + ph) + '" stroke="#999"/>';
  series.forEach((s, k) => {
    const [color, dash] = LINE_STYLES[k % LINE_STYLES.length];
    const pts = s.values.map((v, i) => v === null || v === undefined ? null : [x(i), y(v)]).filter(Boolean);
    if (!pts.length) return;
    g += '<path d="' + pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + '" fill="none" stroke="' + color + '" stroke-width="2.5"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + '/>';
    pts.forEach(p => g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + color + '"/>');
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + escHtml(opts.label || "chart") + '">' + g + '</svg>';
}
function legend(series){
  return '<div class="lg">' + series.map((s, k) => { const [c, dash] = LINE_STYLES[k % LINE_STYLES.length];
    return '<span><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="' + c + '" stroke-width="3"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + '/></svg>' + escHtml(s.name) + '</span>'; }).join("") + '</div>';
}

function renderMyData(d, stale){
  const list = d.students.filter(s => s.behaviors.length || s.goals.length);
  if (!list.length) { $("dataBody").innerHTML = '<p class="empty-note">No data yet.</p>'; return; }
  if (!list.some(s => s.initials === dataStudent)) dataStudent = list[0].initials;
  const s = list.find(x => x.initials === dataStudent);
  const when = d.loadedAt ? new Date(d.loadedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  let html = '<div class="d-top"><span class="when">' + (stale ? "Updating…" : "Updated " + escHtml(when)) + '</span><button class="d-btn" id="dRefresh">Refresh</button></div>';
  html += '<div class="d-students">' + list.map(x => '<button data-stu="' + escHtml(x.initials) + '" aria-pressed="' + (x.initials === dataStudent) + '" style="background:' + escHtml(x.color) + ';color:' + inkFor(x.color) + '">' + escHtml(x.initials) + '</button>').join("") + '</div>';

  if (d.visError) html += '<p class="empty-note" style="background:#FFF1B8;border:3px solid #000;border-radius:12px;padding:8px 10px">' + escHtml(d.visError) + '</p>';
  html += studentSection(d, s);
  html += '<div class="d-actions"><button class="d-btn" id="dPrintOne">Print ' + escHtml(s.initials) + '</button><button class="d-btn" id="dPrintAll">Print all students</button></div>';
  html += '<button class="d-btn" id="dLock" style="margin-top:6px">Lock My data on this phone</button>';
  $("dataBody").innerHTML = html;
  $("dataBody").querySelectorAll("[data-stu]").forEach(b => b.addEventListener("click", () => { dataStudent = b.dataset.stu; renderMyData(d, false); window.scrollTo(0, 0); }));
  $("dRefresh").addEventListener("click", () => { $("dataBody").querySelector(".when").textContent = "Updating…"; loadMyData(); });
  $("dLock").addEventListener("click", () => { store.set(PIN_KEY, ""); store.set("parachute:mydata", ""); goLaunch(); toast("Locked"); });
  $("dataBody").querySelectorAll("[data-bs]").forEach(cb => cb.addEventListener("change", () => {
    const k = cb.dataset.bs;
    bathSel = cb.checked ? [...new Set([...bathSel, k])] : bathSel.filter(x => x !== k);
    store.set("parachute:bathsel", JSON.stringify(bathSel));
    bathPickOpen = true;
    const y = window.scrollY; renderMyData(d, false); window.scrollTo(0, y);
  }));
  const dp = $("dataBody").querySelector(".d-pick");
  if (dp) dp.addEventListener("toggle", () => { bathPickOpen = dp.open; });
  $("dPrintOne").addEventListener("click", () => printData(d, [s]));
  $("dPrintAll").addEventListener("click", () => printData(d, list));
}

/* one student's charts and tables (used on screen and for printing) */
function studentSection(d, s){
  let html = "";
  // behaviors
  if (s.behaviors.length) {
    const labels = d.days.map(shortDate);
    const series = s.behaviors.map(b => ({ name: b.name + (b.measure === "minutes" ? " (min)" : ""), values: b.values }));
    html += '<div class="d-card"><div class="d-title">Behaviors <small>per school day, last 4 weeks</small></div>' +
      lineChart(labels, series, { label: s.initials + " behaviors per day" }) + legend(series);
    html += '<table class="d-table"><thead><tr><th>Behavior</th><th>This week</th><th>Last week</th></tr></thead><tbody>' +
      s.behaviors.map(b => { const n = b.values.length, wk = b.values.slice(n - 5).reduce((a, c) => a + c, 0), prev = b.values.slice(n - 10, n - 5).reduce((a, c) => a + c, 0);
        return '<tr><td>' + escHtml(b.name) + '</td><td>' + wk + (b.measure === "minutes" ? " min" : "") + '</td><td>' + prev + (b.measure === "minutes" ? " min" : "") + '</td></tr>'; }).join("") +
      '</tbody></table></div>';
  }

  // bathroom (read from The Vis)
  if (s.bathroom && s.bathroom.trips.some(v => v > 0)) {
    const bt = s.bathroom, n = bt.trips.length, sum = a => a.reduce((x, y) => x + y, 0);
    const wk = a => sum(a.slice(n - 5));
    const wkT = wk(bt.trips), wkV = wk(bt.voids);
    const pct = wkT ? Math.round(wkV / wkT * 100) : 0;
    const labels = d.days.map(shortDate);
    const counts = { trips: ["Trips", bt.trips], voids: ["Voided in toilet", bt.voids], bms: ["BMs", bt.bms], accidents: ["Accidents", bt.accidents] };
    const pick = BATH_OPTIONS.map(o => '<label><input type="checkbox" data-bs="' + o[0] + '"' + (bathSel.includes(o[0]) ? " checked" : "") + '> ' + o[1] + '</label>').join("");
    const shown = BATH_OPTIONS.filter(o => bathSel.includes(o[0])).map(o => o[1]).join(", ") || "nothing";
    html += '<div class="d-card"><div class="d-title">Bathroom<span class="d-big">' + pct + '%</span></div>' +
      '<div class="d-sub">voided in the toilet this week · from The Vis</div>' +
      '<details class="d-pick no-print"' + (bathPickOpen ? " open" : "") + '><summary>Chart: ' + escHtml(shown) + ' <span aria-hidden="true">▾</span></summary><div class="d-pick-box">' + pick + '</div></details>';
    if (bathSel.includes("pct")) {
      const daily = bt.trips.map((t, i) => t ? Math.round(bt.voids[i] / t * 100) : null);
      html += lineChart(labels, [{ name: "% voided in toilet", values: daily }], { yMax: 100, unit: "%", label: s.initials + " percent of trips voided in toilet per day" });
    }
    const cs = Object.keys(counts).filter(k => bathSel.includes(k)).map(k => ({ name: counts[k][0], values: counts[k][1] }));
    if (cs.length) html += lineChart(labels, cs, { label: s.initials + " bathroom counts per day" }) + legend(cs);
    html += '<div class="d-stats">' +
        [["Trips", wkT], ["Voided", wkV], ["BMs", wk(bt.bms)], ["Accidents", wk(bt.accidents)]]
          .map(x => '<div><b>' + x[1] + '</b><span>' + x[0] + '</span></div>').join("") +
      '</div><div class="d-sub" style="margin-top:4px">this week</div>' +
      '<div class="d-trips">' + bt.recent.slice(0, 5).map(r =>
        '<div class="d-trip"><span class="tw">' + shortDate(r.d) + '<br>' + escHtml(r.t) + '</span>' +
        '<span class="what">' + escHtml(r.what) + '<small>' + escHtml(r.by || "") + '</small></span>' +
        (r.prompt ? '<span class="pr">' + escHtml(r.prompt) + '</span>' : '') + '</div>').join("") + '</div></div>';
  }

  // goals
  s.goals.forEach(g => {
    const ses = g.sessions, last = ses[ses.length - 1];
    const fmt = v => g.unit === "%" ? v + "%" : v + " " + g.unit;
    html += '<div class="d-card"><div class="d-title">' + escHtml(g.goal) + '<span class="d-big">' + fmt(last.v) + '</span></div>' +
      '<div class="d-sub">' + ses.length + ' session' + (ses.length === 1 ? "" : "s") + ' · last ' + shortDate(last.d) + '</div>' +
      lineChart(ses.map(x => shortDate(x.d)), [{ name: g.goal, values: ses.map(x => x.v) }], { yMax: g.unit === "%" ? 100 : 0, unit: g.unit, goalLine: g.unit === "%" ? 80 : 0, label: g.goal + " by session" }) +
      '<table class="d-table"><thead><tr><th>Date</th><th>Result</th><th>Tries</th><th>From</th></tr></thead><tbody>' +
      ses.slice(-5).reverse().map(x => '<tr><td>' + shortDate(x.d) + '</td><td>' + fmt(x.v) + (x.tries ? ' <small>(' + x.got + '/' + x.tries + ')</small>' : "") + '</td><td>' + (x.tries || "–") + '</td><td>' + escHtml(x.src === "The Parachute" ? (x.by || "Parachute") : x.src) + '</td></tr>').join("") +
      '</tbody></table></div>';
  });
  if (!s.goals.length) html += '<p class="empty-note">No goal data for ' + escHtml(s.initials) + ' yet.</p>';
  return html;
}

/* print: a clean page per student, with the date range */
function printData(d, students){
  const range = shortDate(d.days[0]) + " – " + shortDate(d.days[d.days.length - 1]);
  const made = new Date(d.loadedAt || Date.now()).toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  $("printArea").innerHTML = students.map(s =>
    '<section class="p-page"><div class="p-head"><div><div class="p-name">' + escHtml(s.initials) + '</div><div class="p-meta">Behaviors: school days ' + escHtml(range) + ' · Goals: last 30 sessions</div></div>' +
    '<div class="p-meta" style="text-align:right">The Parachute<br>Printed ' + escHtml(made) + '</div></div><div class="p-grid">' + studentSection(d, s) + '</div></section>').join("");
  document.body.classList.add("printing");
  setTimeout(() => window.print(), 50);
}
window.addEventListener("afterprint", () => { document.body.classList.remove("printing"); $("printArea").innerHTML = ""; });

/* ---------- screens ---------- */
function show(screen){
  ["screenWho", "screenHome", "screenStudents", "screenBehaviors", "screenGoalList", "screenGoal", "screenMyData"].forEach(id => $(id).hidden = id !== screen);
  $("behaviorFooter").hidden = screen !== "screenBehaviors";
  $("goalFooter").hidden = screen !== "screenGoal";
  $("btnBack").hidden = !["screenBehaviors", "screenStudents", "screenGoalList", "screenGoal", "screenMyData"].includes(screen);
  $("btnWho").hidden = screen !== "screenHome";
  screenNow = screen;
  window.scrollTo(0, 0);
}

// Light colors (like yellow) get black initials so they stay readable
function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
  if (!m) return "#fff";
  const n = parseInt(m[1], 16), ch = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  const L = .2126 * ch[0] + .7152 * ch[1] + .0722 * ch[2];
  return L > .35 ? "#111" : "#fff";
}

let pickFor = "behavior"; // which tool the student grid is for
function renderStudents(){
  const grid = $("studentGrid");
  grid.innerHTML = "";
  const list = pickFor === "goal" ? students.filter(s => (s.goals || []).length) : students;
  if (pickFor === "goal" && students.length && !list.length) {
    grid.innerHTML = '<div class="msg" style="grid-column:1/-1">No goals are set up yet. Mr. Tucker adds them on the Goals tab of the Sheet.</div>';
  }
  list.forEach(s => {
    const b = document.createElement("button");
    b.className = "student";
    b.style.background = s.color;
    b.style.color = inkFor(s.color);
    b.textContent = s.initials;
    b.addEventListener("click", () => pickFor === "goal" ? openGoalList(s) : openStudent(s));
    grid.appendChild(b);
  });
  if (!students.length && $("studentsMsg").hidden) {
    $("studentsMsg").hidden = false;
    $("studentsMsg").textContent = "Loading students…";
  }
}

function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function openStudent(s){
  current = s;
  $("toast").classList.remove("show"); // don't cover Cancel/Submit with the last "Saved" message
  // "When" is captured as the screen opens and stays put, so a delay before Submit doesn't shift it
  $("whenInput").value = nowHHMM();
  $("whenInput").max = nowHHMM();
  document.querySelector(".when").classList.remove("edited");
  tally = {};
  s.behaviors.forEach(b => tally[b] = { count: 0, min: 0 });
  setMode("count");
  $("title").innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.style.background = s.color;
  chip.style.color = inkFor(s.color);
  chip.textContent = s.initials;
  $("title").appendChild(chip);
  renderRows();
  show("screenBehaviors");
}

function renderRows(){
  const rows = $("behaviorRows");
  rows.innerHTML = "";
  current.behaviors.forEach(b => {
    const v = mode === "count" ? tally[b].count : tally[b].min;
    const row = document.createElement("div");
    row.className = "row" + (tally[b].count || tally[b].min ? " has" : "");
    const minus = document.createElement("button");
    minus.className = "pm minus";
    minus.textContent = "−";
    minus.disabled = v === 0;
    minus.setAttribute("aria-label", "Remove one from " + b);
    minus.addEventListener("click", () => change(b, -1));
    const mid = document.createElement("div");
    mid.className = "mid";
    const name = document.createElement("div"); name.className = "name"; name.textContent = b;
    const val = document.createElement("div"); val.className = "val";
    val.textContent = mode === "count" ? (v === 1 ? "1 time" : v + " times") : v + " min";
    const others = mode === "count" ? tally[b].min : tally[b].count;
    if (others) {
      const note = document.createElement("div");
      note.style.cssText = "font-size:.75rem;font-weight:800;color:#555";
      note.textContent = mode === "count" ? "+ " + others + " min" : "+ " + others + (others === 1 ? " time" : " times");
      mid.append(name, val, note);
    } else {
      mid.append(name, val);
    }
    const plus = document.createElement("button");
    plus.className = "pm plus";
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Add one to " + b);
    plus.addEventListener("click", () => change(b, 1));
    row.append(minus, mid, plus);
    rows.appendChild(row);
  });
  $("btnSubmit").disabled = !pendingItems().length;
}

function change(b, d){
  const k = mode === "count" ? "count" : "min";
  tally[b][k] = Math.max(0, Math.min(999, tally[b][k] + d));
  if (navigator.vibrate) navigator.vibrate(15);
  renderRows();
}

function setMode(m){
  mode = m;
  $("modeCount").setAttribute("aria-pressed", String(m === "count"));
  $("modeTime").setAttribute("aria-pressed", String(m === "min"));
  if (current) renderRows();
}

function pendingItems(){
  const items = [];
  if (!current || screenNow !== "screenBehaviors") return items;
  current.behaviors.forEach(b => {
    if (tally[b].count) items.push({ s: current.initials, b, n: tally[b].count, t: "count" });
    if (tally[b].min) items.push({ s: current.initials, b, n: tally[b].min, t: "min" });
  });
  return items;
}

function leave(){
  const n = pendingItems().length;
  if (n && !confirm("Throw away what you entered for " + current.initials + "? It hasn't been saved.")) return;
  goHome();
}

function goHome(){
  current = null;
  pickFor = "behavior";
  $("title").textContent = "Log a behavior";
  renderStudents();
  show("screenStudents");
}

function goGoalStudents(){
  current = null; G = null;
  pickFor = "goal";
  $("title").textContent = "Take goal data";
  renderStudents();
  show("screenStudents");
}

function goLaunch(){
  current = null;
  $("title").textContent = "The Parachute";
  showTeacherTile();
  show("screenHome");
}

async function submit(){
  const items = pendingItems();
  if (!items.length) return;
  const when = $("whenInput").value;
  if (when && when > nowHHMM()) {
    toast("Not saved: that time is later than now. Fix the time and try again.");
    return;
  }
  // Save on the phone right away; it's sent to the Sheet in the background (no waiting on Google)
  const params = { action: "log", by: store.get("parachute:by") || "", items: JSON.stringify(items) };
  if (when) params.at = when;
  enqueue(params);
  const s = current;
  const linked = (s.goals || []).filter(g => g.linked && items.some(it => it.b.toLowerCase() === g.linked.toLowerCase()));
  goHome();
  if (navigator.vibrate) navigator.vibrate(40);
  if (linked.length) askLinked(s, linked, items);
  else toast("✓ Saved for " + s.initials, true);
}

/* ---------- after a linked behavior: did they use their replacement skill? ---------- */
let checkQueue = [];
function askLinked(s, goals, items){
  checkQueue = goals.map(g => ({ s, g }));
  const names = [...new Set(items.map(it => it.b))].join(", ");
  $("checkSaved").textContent = "✓ " + names + " saved for " + s.initials;
  nextCheck();
}
function nextCheck(){
  const c = checkQueue[0];
  if (!c) { $("checkWrap").hidden = true; return; }
  $("checkGoal").textContent = c.s.initials + "’s goal: " + c.g.goal;
  $("checkQ").textContent = "Did " + c.s.initials + " do it?";
  $("checkWrap").hidden = false;
}
$("checkWrap").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const c = checkQueue.shift(); if (!c) return;
  const a = b.dataset.a;
  if (a !== "S") {
    const t = a === "N" ? { ok: false, h: "" } : { ok: true, h: a };
    saveGoal(c.s, c.g, [t], 0);
    toast("✓ Saved", true);
  }
  nextCheck();
});

/* ---------- goal data ---------- */
const HELP = [["I", "None"], ["G", "Point"], ["V", "Tell"], ["M", "Show"], ["P", "Hands on"]];
const TYPE_TEXT = { correct: "Got it / Not yet", correcthelp: "Got it / Not yet + help", help: "How much help", yesno: "Yes / No", count: "Count", duration: "Time" };
let G = null; // the goal being worked on

function openGoalList(s){
  current = s; G = null;
  $("title").innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "chip"; chip.style.background = s.color; chip.style.color = inkFor(s.color); chip.textContent = s.initials;
  $("title").append(chip, document.createTextNode(" Goals"));
  const list = $("goalList"); list.innerHTML = "";
  s.goals.forEach(g => {
    const b = document.createElement("button");
    b.className = "goal-row";
    const sub = ["correct", "correcthelp", "help", "yesno"].includes(g.type) ? g.tries + " tries" : TYPE_TEXT[g.type];
    b.innerHTML = '<span><span class="g-name"></span><span class="g-sub"></span></span><span class="arrow" aria-hidden="true">›</span>';
    b.querySelector(".g-name").textContent = g.goal;
    b.querySelector(".g-sub").textContent = sub;
    b.addEventListener("click", () => openGoal(g));
    list.appendChild(b);
  });
  show("screenGoalList");
}

function openGoal(g){
  G = { g, tries: [], help: "I", n: 0, running: false, startMs: 0, baseSecs: 0, tick: null,
        tgt: (g.targets || [])[0] || "" };
  $("toast").classList.remove("show");
  renderGoal();
  show("screenGoal");
}

const isTrials = t => ["correct", "correcthelp", "help", "yesno"].includes(t);
function goalHasData(){ return G && (G.tries.length > 0 || G.n > 0 || G.running || G.baseSecs > 0); }
function secsNow(){ return G.baseSecs + (G.running ? Math.floor((Date.now() - G.startMs) / 1000) : 0); }
const mmss = x => Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0");

function renderGoal(){
  const { g } = G, body = $("goalBody");
  const t = g.type;
  let html = '<div class="g-card"><div class="g-name"></div><div class="g-sub"><span>' + TYPE_TEXT[t] + '</span>' +
    (isTrials(t) ? '<b>Try ' + Math.min(G.tries.length + 1, Math.max(g.tries, G.tries.length + 1)) + ' <span style="font-size:.9rem;color:#444">of ' + g.tries + '</span></b>' : '') + '</div></div>';
  if (isTrials(t)) {
    const n = Math.max(g.tries, G.tries.length);
    html += '<div class="strip" style="grid-template-columns:repeat(' + Math.min(10, n) + ', minmax(0,1fr))">';
    for (let i = 0; i < n; i++) {
      const x = G.tries[i];
      if (!x) html += '<i class="' + (i === G.tries.length ? "next" : "") + '"></i>';
      else if (!x.ok) html += '<i class="no">✗</i>';
      else if (x.h && x.h !== "I") html += '<i class="help">✓</i>';
      else html += '<i class="ok">✓</i>';
    }
    html += '</div>';
  }
  const hasTargets = isTrials(t) && (g.targets || []).length > 0;
  if (hasTargets) {
    html += '<div class="help-label">Which one are you working on?</div><div class="tgts" id="tgts">' +
      g.targets.map((x, i) => '<button data-tg="' + i + '" aria-pressed="' + (G.tgt === x) + '"></button>').join("") + '</div>';
  }
  if (t === "correct" || t === "correcthelp") {
    if (t === "correcthelp") {
      html += '<div class="help-label">How much help did you give?</div><div class="helps" id="helps">' +
        HELP.map(h => '<button data-h="' + h[0] + '" aria-pressed="' + (G.help === h[0]) + '">' + h[1] + '</button>').join("") + '</div>';
    }
    html += '<div class="ans"><button class="yes" data-t="ok"><span class="big-mark">✓</span><span class="lab">Got it</span></button><button class="no" data-t="no"><span class="big-mark">✗</span><span class="lab">Not yet</span></button></div>';
  } else if (t === "help") {
    html += '<div class="help-label">Tap how much help you gave for this try</div><div class="helps big" id="helps">' +
      HELP.map(h => '<button data-h="' + h[0] + '" data-tap="1">' + h[1] + '</button>').join("") + '</div>';
  } else if (t === "yesno") {
    html += '<div class="ans"><button class="yes" data-t="ok"><span class="big-mark">✓</span><span class="lab">Yes</span></button><button class="no" data-t="no"><span class="big-mark">✗</span><span class="lab">No</span></button></div>';
  } else if (t === "count") {
    html += '<div class="counter"><button class="pm minus" data-c="-1" aria-label="Take one away">−</button><div class="num">' + G.n + '</div><button class="pm plus" data-c="1" aria-label="Add one">+</button></div>';
  } else if (t === "duration") {
    const x = secsNow();
    html += '<div class="clock"><div class="num" id="clockNum">' + mmss(x) + '</div><button class="big ' + (G.running ? "stop-btn" : "go-btn") + '" data-clock="1">' + (G.running ? "Stop" : (x ? "Keep going" : "Start")) + '</button></div>';
  }
  if (isTrials(t) && G.tries.length) {
    const got = G.tries.filter(x => x.ok).length, alone = G.tries.filter(x => x.ok && (!x.h || x.h === "I")).length;
    const pct = v => Math.round(v / G.tries.length * 100) + "%";
    html += '<div class="stats"><div><b>' + pct(got) + '</b><span>Got it</span></div>' +
      (t === "correcthelp" || t === "help" ? '<div><b>' + pct(alone) + '</b><span>No help</span></div>' : '<div></div>') +
      '<div><b>' + G.tries.length + '</b><span>Tries done</span></div></div>';
  }
  body.innerHTML = html;
  body.querySelector(".g-name").textContent = g.goal;
  body.querySelectorAll("[data-tg]").forEach(b => b.textContent = g.targets[+b.dataset.tg]);
  body.querySelectorAll(".strip i").forEach((el, i) => {
    const x = G.tries[i];
    if (x && x.tg) { const sm = document.createElement("small"); sm.textContent = x.tg; el.appendChild(sm); }
  });
  $("btnFinish").disabled = !(G.tries.length || G.n > 0 || G.running || secsNow() > 0);
  $("btnUndo").disabled = !(G.tries.length || G.n > 0 || (!G.running && G.baseSecs > 0));
}

$("goalBody").addEventListener("click", e => {
  if (!G) return;
  const b = e.target.closest("button"); if (!b) return;
  const t = G.g.type;
  if (b.dataset.tg) { G.tgt = G.g.targets[+b.dataset.tg]; renderGoal(); return; }
  if (b.dataset.h && !b.dataset.tap) { G.help = b.dataset.h; renderGoal(); return; }
  const tg = (G.g.targets || []).length ? G.tgt : "";
  if (b.dataset.tap) { G.tries.push(tg ? { ok: b.dataset.h === "I", h: b.dataset.h, tg } : { ok: b.dataset.h === "I", h: b.dataset.h }); }
  else if (b.dataset.t) {
    const ok = b.dataset.t === "ok";
    const tr = { ok, h: t === "correcthelp" ? G.help : "" };
    if (tg) tr.tg = tg;
    G.tries.push(tr);
    G.help = "I"; // next try starts at "None"
    // a miss on a goal with targets: what did they pick instead?
    if (!ok && t !== "yesno" && tg && G.g.targets.length > 1) askPicked(tr);
  }
  else if (b.dataset.c) { G.n = Math.max(0, Math.min(999, G.n + Number(b.dataset.c))); }
  else if (b.dataset.clock) {
    if (G.running) { G.baseSecs = secsNow(); G.running = false; clearInterval(G.tick); }
    else { G.running = true; G.startMs = Date.now(); G.tick = setInterval(() => { const el = $("clockNum"); if (el) el.textContent = mmss(secsNow()); }, 500); }
  } else return;
  if (navigator.vibrate) navigator.vibrate(15);
  renderGoal();
});

$("btnUndo").addEventListener("click", () => {
  if (!G) return;
  if (isTrials(G.g.type)) G.tries.pop();
  else if (G.g.type === "count") G.n = Math.max(0, G.n - 1);
  else if (G.g.type === "duration" && !G.running) G.baseSecs = 0;
  renderGoal();
});

function askPicked(tr){
  const grid = $("pickGrid"); grid.innerHTML = "";
  G.g.targets.filter(x => x !== tr.tg).forEach(x => {
    const b = document.createElement("button"); b.textContent = x;
    b.addEventListener("click", () => { tr.pk = x; $("pickWrap").hidden = true; renderGoal(); });
    grid.appendChild(b);
  });
  const other = document.createElement("button"); other.textContent = "Something else";
  other.addEventListener("click", () => { tr.pk = "Other"; $("pickWrap").hidden = true; renderGoal(); });
  grid.appendChild(other);
  $("pickWrap").hidden = false;
}
$("pickSkip").addEventListener("click", () => { $("pickWrap").hidden = true; });

function saveGoal(s, g, tries, n){
  enqueue({ action: "goal", by: store.get("parachute:by") || "", item: JSON.stringify({ s: s.initials, g: g.goal, type: g.type, tries, n }) });
}

$("btnFinish").addEventListener("click", () => {
  if (!G) return;
  if (G.running) { G.baseSecs = secsNow(); G.running = false; clearInterval(G.tick); }
  const n = G.g.type === "duration" ? G.baseSecs : G.n;
  saveGoal(current, G.g, isTrials(G.g.type) ? G.tries : [], n);
  const s = current;
  G = null;
  openGoalList(s);
  toast("✓ Saved for " + s.initials, true);
  if (navigator.vibrate) navigator.vibrate(40);
});

function leaveGoal(){
  if (goalHasData() && !confirm("Throw away this data? It hasn't been saved. Tap Finish & save to keep it.")) return;
  if (G && G.tick) clearInterval(G.tick);
  const s = current; G = null;
  openGoalList(s);
}

/* ---------- outbox: entries saved on the phone until the Sheet confirms them ---------- */
const OUTBOX_KEY = "parachute:outbox";
const NO_RETRY = ["bad-data", "bad-time", "future-time"]; // the Sheet will never accept these
function readOutbox(){ try { return JSON.parse(store.get(OUTBOX_KEY) || "[]"); } catch { return []; } }
function writeOutbox(box){ store.set(OUTBOX_KEY, JSON.stringify(box)); renderPending(); }

function enqueue(params){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const box = readOutbox();
  box.push({ id, params: { ...params, id, ent: Date.now() }, tries: 0, next: 0, since: Date.now() });
  writeOutbox(box);
  sendOutbox();
}

let sending = false, retryTimer = null;
async function sendOutbox(){
  if (sending) return;
  sending = true;
  clearTimeout(retryTimer);
  try {
    for (;;) {
      const box = readOutbox();
      const item = box.find(e => e.next <= Date.now());
      if (!item) break;
      try {
        await request(item.params);
        writeOutbox(readOutbox().filter(e => e.id !== item.id));
      } catch (err) {
        if (NO_RETRY.includes(err.message)) {
          writeOutbox(readOutbox().filter(e => e.id !== item.id));
          toast("One entry couldn't be saved (" + (err.message === "future-time" ? "time later than now" : err.message) + "). Please enter it again.");
          continue;
        }
        // Try again later: 5s, 15s, 30s, then every minute
        const latest = readOutbox();
        const e = latest.find(x => x.id === item.id);
        if (e) { e.tries++; e.next = Date.now() + ([5000, 15000, 30000][e.tries - 1] || 60000); writeOutbox(latest); }
        break;
      }
    }
  } finally {
    sending = false;
    const box = readOutbox();
    if (box.length) {
      const wait = Math.max(1000, Math.min(...box.map(e => e.next)) - Date.now());
      retryTimer = setTimeout(sendOutbox, wait);
    }
  }
}

function renderPending(){
  const box = readOutbox();
  const chip = $("pendingChip");
  chip.hidden = box.length === 0;
  if (!box.length) return;
  const stuck = box.some(e => Date.now() - e.since > 60000);
  chip.classList.toggle("stuck", stuck);
  chip.textContent = (stuck ? "⚠ " : "⏳ ") + box.length + (stuck ? " waiting to send" : " sending");
}

let toastTimer;
function toast(text, home){
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("home", !!home);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), text.startsWith("Not saved") ? 6000 : 2500);
}

/* ---------- who is using this phone ---------- */
function setWho(by){
  store.set("parachute:by", by);
  $("btnWho").textContent = by;
  goLaunch();
}
// Staff names come from the Sheet's Staff tab
function renderStaff(){
  const list = $("staffList");
  list.innerHTML = "";
  staff.forEach(name => {
    const b = document.createElement("button");
    b.className = "big";
    b.textContent = name;
    b.addEventListener("click", () => setWho(name));
    list.appendChild(b);
  });
  $("staffMsg").hidden = staff.length > 0;
  $("staffMsg").textContent = "Loading names…";
}
$("btnWho").addEventListener("click", () => show("screenWho"));

$("btnBack").addEventListener("click", () => {
  if (screenNow === "screenStudents") goLaunch();
  else if (screenNow === "screenBehaviors") leave();
  else if (screenNow === "screenGoalList") goGoalStudents();
  else if (screenNow === "screenGoal") leaveGoal();
  else if (screenNow === "screenMyData") goLaunch();
});
$("tileGoals").addEventListener("click", goGoalStudents);
$("tileBehavior").addEventListener("click", goHome);
$("btnCancel").addEventListener("click", leave);
$("btnSubmit").addEventListener("click", submit);
// Opening the app, coming back to it, regaining signal, or tapping the chip all mean "try now"
function retryNow(){
  const box = readOutbox();
  if (!box.length) return;
  box.forEach(e => e.next = 0);
  writeOutbox(box);
  sendOutbox();
}
$("pendingChip").addEventListener("click", retryNow);
window.addEventListener("online", retryNow);
setInterval(() => { renderPending(); sendOutbox(); }, 20000);
$("whenInput").addEventListener("change", () => document.querySelector(".when").classList.add("edited"));
$("modeCount").addEventListener("click", () => setMode("count"));
$("modeTime").addEventListener("click", () => setMode("min"));
window.addEventListener("beforeunload", e => { if (pendingItems().length || goalHasData()) { e.preventDefault(); e.returnValue = ""; } });

// Start: show cached students instantly, then refresh from the Sheet
const by = store.get("parachute:by");
if (by) { $("btnWho").textContent = by; goLaunch(); } else { show("screenWho"); }
renderStudents();
renderStaff();
loadStudents();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  retryNow();
  if (!current) loadStudents();
});
renderPending();
retryNow();
</script>
