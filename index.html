<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Parachute" />
  <meta name="theme-color" content="#FFD54F" />
  <title>The Parachute</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    :root{ --bg:#8BC34A; --yellow:#FFD54F; --border:#000; --plus:#3B8F1E; --minus:#D93025; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; }
    body{
      background:var(--bg); color:#111;
      font-family:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
    button:focus-visible{ outline:4px solid #1565c0; outline-offset:2px; }
    .app{ min-height:100%; display:flex; flex-direction:column; }
    header{
      position:sticky; top:0; z-index:5; background:var(--yellow); border-bottom:5px solid var(--border);
      padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
      display:flex; align-items:center; gap:10px; min-height:58px;
    }
    header h1{ margin:0; font-size:1.35rem; font-weight:900; flex:1; display:flex; align-items:center; gap:8px; }
    .back{ border:3px solid var(--border); background:#fff; border-radius:12px; padding:6px 12px; font-weight:900; font-size:1rem; }
    .who-chip{ border:3px solid var(--border); background:#fff; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.85rem; }
    .pending-chip{ border:3px solid var(--border); background:#fff; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.8rem; white-space:nowrap; }
    .pending-chip.stuck{ background:#FFB74D; }
    .chip{ color:#fff; border-radius:999px; padding:2px 14px; font-weight:900; }
    main{ flex:1; padding:14px; max-width:560px; width:100%; margin:0 auto; }
    .hint{ font-weight:800; margin:2px 2px 12px; color:#173404; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .student{
      border:4px solid var(--border); border-radius:18px; min-height:92px; color:#fff;
      font-size:1.8rem; font-weight:900; letter-spacing:.02em;
    }
    .student:active, .pm:active, .big:active{ transform:scale(.97); }
    .rows{ display:flex; flex-direction:column; gap:12px; }
    .row{
      display:grid; grid-template-columns:72px 1fr 72px; min-height:78px;
      border:4px solid var(--border); border-radius:16px; overflow:hidden; background:#fff;
    }
    .pm{ border:0; color:#fff; font-size:2.2rem; font-weight:900; line-height:1; }
    .pm.minus{ background:var(--minus); }
    .pm.plus{ background:var(--plus); }
    .pm:disabled{ opacity:.35; }
    .mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px 6px; }
    .mid .name{ font-weight:800; font-size:1rem; line-height:1.15; }
    .mid .val{ font-weight:900; font-size:1.5rem; font-variant-numeric:tabular-nums; }
    .row.has .mid{ background:#FFF1B8; }
    footer{
      position:sticky; bottom:0; background:var(--yellow); border-top:5px solid var(--border);
      padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px;
    }
    .when{
      display:flex; align-items:center; gap:10px; background:#fff; border:4px solid var(--border);
      border-radius:14px; padding:4px 12px; min-height:52px; font-weight:900;
    }
    .when-label{ font-size:1.05rem; }
    .when input{
      font:inherit; font-weight:900; font-size:1.3rem; border:0; background:transparent; color:#111;
      min-width:0; flex:0 1 auto; padding:4px 0;
    }
    .when input:focus-visible{ outline:3px solid #1565c0; border-radius:6px; }
    .when-hint{ margin-left:auto; font-size:.8rem; font-weight:800; color:#555; white-space:nowrap; }
    .when.edited{ background:#FFF1B8; }
    .when.edited .when-hint{ color:#7a4b00; }
    .toggle{ display:grid; grid-template-columns:1fr 1fr; border:4px solid var(--border); border-radius:14px; overflow:hidden; }
    .toggle button{ border:0; background:#fff; font-weight:900; font-size:1.1rem; min-height:50px; }
    .toggle button[aria-pressed="true"]{ background:#111; color:#fff; }
    .actions{ display:grid; grid-template-columns:1fr 1.5fr; gap:10px; }
    .big{ border:4px solid var(--border); border-radius:14px; min-height:58px; font-weight:900; font-size:1.2rem; }
    .cancel{ background:#fff; }
    .submit{ background:#2E7D32; color:#fff; }
    .submit:disabled{ background:#c9d6c9; color:#555; }
    .pick{ display:flex; flex-direction:column; gap:12px; }
    .pick .big{ background:#fff; min-height:72px; font-size:1.4rem; }
    .launch{ display:flex; flex-direction:column; gap:12px; }
    .tile{
      display:flex; align-items:center; gap:14px; text-align:left; width:100%;
      border:4px solid var(--border); border-radius:18px; min-height:92px; padding:12px 16px; color:#fff;
    }
    .tile svg{ flex-shrink:0; }
    .tile .t-name{ display:block; font-size:1.45rem; font-weight:900; line-height:1.1; }
    .tile .t-sub{ display:block; font-size:.95rem; font-weight:800; opacity:.92; margin-top:2px; }
    .tile.behavior{ background:#D93025; }
    .tile.show{ background:#6A1B9A; text-decoration:none; }
    .tile.soon{ background:#fff; color:#555; border-style:dashed; min-height:72px; cursor:default; }
    .tile.soon .t-name{ font-size:1.15rem; color:#333; }
    .tile.goals{ background:#1565C0; }
    .goal-list{ display:flex; flex-direction:column; gap:10px; }
    .goal-row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; border:4px solid var(--border); border-radius:16px; padding:12px 14px; min-height:72px; }
    .goal-row .g-name{ display:block; font-size:1.15rem; font-weight:900; line-height:1.2; }
    .goal-row .g-sub{ display:block; font-size:.9rem; font-weight:800; color:#444; margin-top:2px; }
    .goal-row .arrow{ margin-left:auto; font-size:1.6rem; font-weight:900; }
    .g-card{ background:#fff; border:4px solid var(--border); border-radius:16px; padding:10px 14px; margin-bottom:12px; }
    .g-card .g-name{ font-size:1.2rem; font-weight:900; line-height:1.2; }
    .g-card .g-sub{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; font-weight:800; color:#444; }
    .g-card .g-sub b{ font-size:1.4rem; color:#111; }
    .strip{ display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:4px; margin-bottom:12px; }
    .strip i{ height:36px; border:3px solid #5E8A2C; border-radius:8px; background:#A5D46B; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:900; font-size:.95rem; }
    .strip i.ok{ background:var(--plus); border-color:#000; color:#fff; }
    .strip i.help{ background:#FFF1B8; border-color:#000; color:#111; }
    .strip i.no{ background:var(--minus); border-color:#000; color:#fff; }
    .strip i.next{ background:#fff; border:3px dashed #000; }
    .ans{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .ans button{ min-height:130px; border:4px solid var(--border); border-radius:18px; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    .ans .big-mark{ font-size:3.4rem; font-weight:900; line-height:1; }
    .ans .lab{ font-size:1.15rem; font-weight:900; }
    .ans .yes{ background:var(--plus); } .ans .no{ background:var(--minus); }
    .help-label{ font-weight:900; color:#173404; margin:4px 2px 6px; }
    .helps{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); border:4px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; margin-bottom:12px; }
    .helps button{ border:0; border-left:3px solid #000; background:#fff; min-height:54px; font-weight:900; font-size:.95rem; padding:0 2px; line-height:1.05; }
    .helps button:first-child{ border-left:0; }
    .helps button[aria-pressed="true"]{ background:#111; color:#fff; }
    .helps.big button{ min-height:84px; font-size:1.05rem; }
    .stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; text-align:center; background:#fff; border:4px solid var(--border); border-radius:16px; padding:8px; }
    .stats b{ display:block; font-size:1.4rem; font-weight:900; }
    .stats span{ font-size:.8rem; font-weight:800; color:#444; }
    .counter{ display:grid; grid-template-columns:96px 1fr 96px; border:4px solid var(--border); border-radius:18px; overflow:hidden; background:#fff; min-height:130px; margin-bottom:12px; }
    .counter .num{ display:flex; align-items:center; justify-content:center; font-size:3.2rem; font-weight:900; font-variant-numeric:tabular-nums; }
    .clock{ background:#fff; border:4px solid var(--border); border-radius:18px; text-align:center; padding:16px; margin-bottom:12px; }
    .clock .num{ font-size:3.4rem; font-weight:900; font-variant-numeric:tabular-nums; }
    .clock button{ margin-top:8px; width:100%; }
    .go-btn{ background:var(--plus); color:#fff; } .stop-btn{ background:var(--minus); color:#fff; }
    .check-wrap{ position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; }
    .check-wrap[hidden]{ display:none; }
    .check{ width:100%; max-width:560px; margin:0 auto; background:var(--yellow); border-top:5px solid #000; border-radius:24px 24px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; }
    .check .saved{ background:#fff; border:4px solid #000; border-radius:14px; padding:8px 12px; font-weight:900; }
    .check .q-goal{ font-weight:900; color:#0D47A1; font-size:.95rem; }
    .check .q{ font-size:1.6rem; font-weight:900; line-height:1.15; }
    .check .big{ min-height:62px; }
    .check .b-yes{ background:#2E7D32; color:#fff; } .check .b-help{ background:#1565C0; color:#fff; } .check .b-no{ background:#fff; }
    .check .skip{ border:0; background:transparent; font-weight:800; text-decoration:underline; min-height:44px; }
    .soon-label{ font-weight:900; color:#173404; margin:8px 2px 0; }
    .msg{ background:#fff; border:4px solid var(--border); border-radius:16px; padding:16px; font-weight:800; text-align:center; }
    .toast{
      position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
      background:#111; color:#fff; font-weight:900; padding:12px 18px; border-radius:999px; max-width:92vw; text-align:center;
      box-shadow:0 4px 14px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20;
    }
    .toast.show{ opacity:1; }
    .toast.home{ bottom:calc(24px + env(safe-area-inset-bottom,0px)); }
    [hidden]{ display:none !important; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="btnBack" hidden aria-label="Go back">‹ Back</button>
    <h1 id="title">The Parachute</h1>
    <button class="pending-chip" id="pendingChip" hidden aria-label="Entries waiting to send. Tap to try now."></button>
    <button class="who-chip" id="btnWho" hidden aria-label="Change who is using this phone"></button>
  </header>

  <!-- First time only: who is using this phone -->
  <main id="screenWho" hidden>
    <p class="hint">Who's using this phone? (You'll only be asked once.)</p>
    <div class="pick" id="staffList"></div>
    <div class="msg" id="staffMsg" hidden></div>
  </main>

  <!-- Launchpad: the aide's home screen -->
  <main id="screenHome" hidden>
    <div class="launch">
      <button class="tile behavior" id="tileBehavior">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span><span class="t-name">Log a behavior</span><span class="t-sub">Count it with + and −</span></span>
      </button>
      <a class="tile show" href="pocket-kit.html">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="2"/><rect x="13" y="5" width="8" height="14" rx="2"/></svg>
        <span><span class="t-name">Show a student</span><span class="t-sub">Pocket Kit: timer, first/then, choices, cards</span></span>
      </a>
      <button class="tile goals" id="tileGoals">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
        <span><span class="t-name">Take goal data</span><span class="t-sub">Mark each try</span></span>
      </button>
      <p class="soon-label">Coming soon</p>
      <div class="tile soon" aria-disabled="true"><span><span class="t-name">Daily checklist</span><span class="t-sub">When you arrive and before you leave</span></span></div>
    </div>
  </main>

  <!-- Screen 1: students -->
  <main id="screenStudents" hidden>
    <p class="hint">Tap a student</p>
    <div class="grid" id="studentGrid"></div>
    <div class="msg" id="studentsMsg" hidden></div>
  </main>

  <!-- Goals for one student -->
  <main id="screenGoalList" hidden>
    <p class="hint">Pick a goal</p>
    <div class="goal-list" id="goalList"></div>
  </main>

  <!-- Taking data on one goal -->
  <main id="screenGoal" hidden>
    <div id="goalBody"></div>
  </main>
  <footer id="goalFooter" hidden>
    <div class="actions">
      <button class="big cancel" id="btnUndo">Oops, undo</button>
      <button class="big submit" id="btnFinish" disabled>Finish &amp; save</button>
    </div>
  </footer>

  <!-- Screen 2: behaviors for one student -->
  <main id="screenBehaviors" hidden>
    <div class="rows" id="behaviorRows"></div>
  </main>
  <footer id="behaviorFooter" hidden>
    <label class="when" for="whenInput">
      <span class="when-label">When:</span>
      <input type="time" id="whenInput" aria-label="When it happened" />
      <span class="when-hint" aria-hidden="true">✎ tap to change</span>
    </label>
    <div class="toggle" role="group" aria-label="Measure">
      <button id="modeCount" aria-pressed="true">Count</button>
      <button id="modeTime" aria-pressed="false">Time (minutes)</button>
    </div>
    <div class="actions">
      <button class="big cancel" id="btnCancel">Cancel</button>
      <button class="big submit" id="btnSubmit" disabled>Submit</button>
    </div>
  </footer>
</div>
<div class="check-wrap" id="checkWrap" hidden>
  <div class="check" role="dialog" aria-modal="true" aria-labelledby="checkQ">
    <div class="saved" id="checkSaved"></div>
    <div class="q-goal" id="checkGoal"></div>
    <div class="q" id="checkQ"></div>
    <button class="big b-yes" data-a="I">Yes, by themselves</button>
    <button class="big b-help" data-a="H">Yes, after I helped</button>
    <button class="big b-no" data-a="N">No</button>
    <button class="skip" data-a="S">Skip for now</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---- Connection (filled in once; the aides never see or change this) ----
// After deploying Code.gs as a web app, paste its URL between the quotes on the next line.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz3MkE3Ev39aRMZK9lkbcgRvSjt1HKmcz75D-PAJa-YOL0qQvZnkIs-2yK8IxQj3bs/exec";
const KEY = "skhqdkxwzat0zmt2qg"; // must match KEY in Code.gs

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let students = JSON.parse(store.get("parachute:students") || "[]");
let staff = JSON.parse(store.get("parachute:staff") || "[]");
let current = null;            // student being logged
let mode = "count";            // "count" | "min"
let tally = {};                // behavior -> { count, min }
let screenNow = "";

/* ---------- talking to the Sheet ---------- */
async function request(params){
  if (!ENDPOINT.startsWith("https://")) throw new Error("not-set-up");
  const url = new URL(ENDPOINT);
  Object.entries({ ...params, key: KEY }).forEach(([k, v]) => url.searchParams.set(k, v));
  let res;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  try { res = await fetch(url.toString(), { cache: "no-store", signal: ctl.signal }); }
  catch { throw new Error("no connection"); }
  finally { clearTimeout(timer); }
  let data;
  try { data = JSON.parse(await res.text()); } catch { throw new Error("Google error " + res.status); }
  if (!data.ok) throw new Error(data.error || "error");
  return data;
}

async function loadStudents(){
  try {
    const data = await request({ action: "setup" });
    students = data.students || [];
    staff = data.staff || [];
    store.set("parachute:students", JSON.stringify(students));
    store.set("parachute:staff", JSON.stringify(staff));
    $("studentsMsg").hidden = true;
  } catch (err) {
    if (!students.length) {
      $("studentsMsg").hidden = false;
      $("studentsMsg").textContent = !ENDPOINT.startsWith("https://")
        ? "Not connected to the Google Sheet yet. Mr. Tucker needs to finish setup."
        : err.message === "bad-key"
          ? "The connection key doesn't match the Sheet. Mr. Tucker needs to check setup."
          : "Can't load students. Check the internet connection and reopen the app.";
    }
  }
  renderStudents();
  renderStaff();
}

/* ---------- screens ---------- */
function show(screen){
  ["screenWho", "screenHome", "screenStudents", "screenBehaviors", "screenGoalList", "screenGoal"].forEach(id => $(id).hidden = id !== screen);
  $("behaviorFooter").hidden = screen !== "screenBehaviors";
  $("goalFooter").hidden = screen !== "screenGoal";
  $("btnBack").hidden = !["screenBehaviors", "screenStudents", "screenGoalList", "screenGoal"].includes(screen);
  $("btnWho").hidden = screen !== "screenHome";
  screenNow = screen;
  window.scrollTo(0, 0);
}

// Light colors (like yellow) get black initials so they stay readable
function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
  if (!m) return "#fff";
  const n = parseInt(m[1], 16), ch = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  const L = .2126 * ch[0] + .7152 * ch[1] + .0722 * ch[2];
  return L > .35 ? "#111" : "#fff";
}

let pickFor = "behavior"; // which tool the student grid is for
function renderStudents(){
  const grid = $("studentGrid");
  grid.innerHTML = "";
  const list = pickFor === "goal" ? students.filter(s => (s.goals || []).length) : students;
  if (pickFor === "goal" && students.length && !list.length) {
    grid.innerHTML = '<div class="msg" style="grid-column:1/-1">No goals are set up yet. Mr. Tucker adds them on the Goals tab of the Sheet.</div>';
  }
  list.forEach(s => {
    const b = document.createElement("button");
    b.className = "student";
    b.style.background = s.color;
    b.style.color = inkFor(s.color);
    b.textContent = s.initials;
    b.addEventListener("click", () => pickFor === "goal" ? openGoalList(s) : openStudent(s));
    grid.appendChild(b);
  });
  if (!students.length && $("studentsMsg").hidden) {
    $("studentsMsg").hidden = false;
    $("studentsMsg").textContent = "Loading students…";
  }
}

function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function openStudent(s){
  current = s;
  $("toast").classList.remove("show"); // don't cover Cancel/Submit with the last "Saved" message
  // "When" is captured as the screen opens and stays put, so a delay before Submit doesn't shift it
  $("whenInput").value = nowHHMM();
  $("whenInput").max = nowHHMM();
  document.querySelector(".when").classList.remove("edited");
  tally = {};
  s.behaviors.forEach(b => tally[b] = { count: 0, min: 0 });
  setMode("count");
  $("title").innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.style.background = s.color;
  chip.style.color = inkFor(s.color);
  chip.textContent = s.initials;
  $("title").appendChild(chip);
  renderRows();
  show("screenBehaviors");
}

function renderRows(){
  const rows = $("behaviorRows");
  rows.innerHTML = "";
  current.behaviors.forEach(b => {
    const v = mode === "count" ? tally[b].count : tally[b].min;
    const row = document.createElement("div");
    row.className = "row" + (tally[b].count || tally[b].min ? " has" : "");
    const minus = document.createElement("button");
    minus.className = "pm minus";
    minus.textContent = "−";
    minus.disabled = v === 0;
    minus.setAttribute("aria-label", "Remove one from " + b);
    minus.addEventListener("click", () => change(b, -1));
    const mid = document.createElement("div");
    mid.className = "mid";
    const name = document.createElement("div"); name.className = "name"; name.textContent = b;
    const val = document.createElement("div"); val.className = "val";
    val.textContent = mode === "count" ? (v === 1 ? "1 time" : v + " times") : v + " min";
    const others = mode === "count" ? tally[b].min : tally[b].count;
    if (others) {
      const note = document.createElement("div");
      note.style.cssText = "font-size:.75rem;font-weight:800;color:#555";
      note.textContent = mode === "count" ? "+ " + others + " min" : "+ " + others + (others === 1 ? " time" : " times");
      mid.append(name, val, note);
    } else {
      mid.append(name, val);
    }
    const plus = document.createElement("button");
    plus.className = "pm plus";
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Add one to " + b);
    plus.addEventListener("click", () => change(b, 1));
    row.append(minus, mid, plus);
    rows.appendChild(row);
  });
  $("btnSubmit").disabled = !pendingItems().length;
}

function change(b, d){
  const k = mode === "count" ? "count" : "min";
  tally[b][k] = Math.max(0, Math.min(999, tally[b][k] + d));
  if (navigator.vibrate) navigator.vibrate(15);
  renderRows();
}

function setMode(m){
  mode = m;
  $("modeCount").setAttribute("aria-pressed", String(m === "count"));
  $("modeTime").setAttribute("aria-pressed", String(m === "min"));
  if (current) renderRows();
}

function pendingItems(){
  const items = [];
  if (!current || screenNow !== "screenBehaviors") return items;
  current.behaviors.forEach(b => {
    if (tally[b].count) items.push({ s: current.initials, b, n: tally[b].count, t: "count" });
    if (tally[b].min) items.push({ s: current.initials, b, n: tally[b].min, t: "min" });
  });
  return items;
}

function leave(){
  const n = pendingItems().length;
  if (n && !confirm("Throw away what you entered for " + current.initials + "? It hasn't been saved.")) return;
  goHome();
}

function goHome(){
  current = null;
  pickFor = "behavior";
  $("title").textContent = "Log a behavior";
  renderStudents();
  show("screenStudents");
}

function goGoalStudents(){
  current = null; G = null;
  pickFor = "goal";
  $("title").textContent = "Take goal data";
  renderStudents();
  show("screenStudents");
}

function goLaunch(){
  current = null;
  $("title").textContent = "The Parachute";
  show("screenHome");
}

async function submit(){
  const items = pendingItems();
  if (!items.length) return;
  const when = $("whenInput").value;
  if (when && when > nowHHMM()) {
    toast("Not saved: that time is later than now. Fix the time and try again.");
    return;
  }
  // Save on the phone right away; it's sent to the Sheet in the background (no waiting on Google)
  const params = { action: "log", by: store.get("parachute:by") || "", items: JSON.stringify(items) };
  if (when) params.at = when;
  enqueue(params);
  const s = current;
  const linked = (s.goals || []).filter(g => g.linked && items.some(it => it.b.toLowerCase() === g.linked.toLowerCase()));
  goHome();
  if (navigator.vibrate) navigator.vibrate(40);
  if (linked.length) askLinked(s, linked, items);
  else toast("✓ Saved for " + s.initials, true);
}

/* ---------- after a linked behavior: did they use their replacement skill? ---------- */
let checkQueue = [];
function askLinked(s, goals, items){
  checkQueue = goals.map(g => ({ s, g }));
  const names = [...new Set(items.map(it => it.b))].join(", ");
  $("checkSaved").textContent = "✓ " + names + " saved for " + s.initials;
  nextCheck();
}
function nextCheck(){
  const c = checkQueue[0];
  if (!c) { $("checkWrap").hidden = true; return; }
  $("checkGoal").textContent = c.s.initials + "’s goal: " + c.g.goal;
  $("checkQ").textContent = "Did " + c.s.initials + " do it?";
  $("checkWrap").hidden = false;
}
$("checkWrap").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const c = checkQueue.shift(); if (!c) return;
  const a = b.dataset.a;
  if (a !== "S") {
    const t = a === "N" ? { ok: false, h: "" } : { ok: true, h: a };
    saveGoal(c.s, c.g, [t], 0);
    toast("✓ Saved", true);
  }
  nextCheck();
});

/* ---------- goal data ---------- */
const HELP = [["I", "None"], ["G", "Point"], ["V", "Tell"], ["M", "Show"], ["P", "Hands on"]];
const TYPE_TEXT = { correct: "Got it / Not yet", correcthelp: "Got it / Not yet + help", help: "How much help", yesno: "Yes / No", count: "Count", duration: "Time" };
let G = null; // the goal being worked on

function openGoalList(s){
  current = s; G = null;
  $("title").innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "chip"; chip.style.background = s.color; chip.style.color = inkFor(s.color); chip.textContent = s.initials;
  $("title").append(chip, document.createTextNode(" Goals"));
  const list = $("goalList"); list.innerHTML = "";
  s.goals.forEach(g => {
    const b = document.createElement("button");
    b.className = "goal-row";
    const sub = ["correct", "correcthelp", "help", "yesno"].includes(g.type) ? g.tries + " tries" : TYPE_TEXT[g.type];
    b.innerHTML = '<span><span class="g-name"></span><span class="g-sub"></span></span><span class="arrow" aria-hidden="true">›</span>';
    b.querySelector(".g-name").textContent = g.goal;
    b.querySelector(".g-sub").textContent = sub;
    b.addEventListener("click", () => openGoal(g));
    list.appendChild(b);
  });
  show("screenGoalList");
}

function openGoal(g){
  G = { g, tries: [], help: "I", n: 0, running: false, startMs: 0, baseSecs: 0, tick: null };
  $("toast").classList.remove("show");
  renderGoal();
  show("screenGoal");
}

const isTrials = t => ["correct", "correcthelp", "help", "yesno"].includes(t);
function goalHasData(){ return G && (G.tries.length > 0 || G.n > 0 || G.running || G.baseSecs > 0); }
function secsNow(){ return G.baseSecs + (G.running ? Math.floor((Date.now() - G.startMs) / 1000) : 0); }
const mmss = x => Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0");

function renderGoal(){
  const { g } = G, body = $("goalBody");
  const t = g.type;
  let html = '<div class="g-card"><div class="g-name"></div><div class="g-sub"><span>' + TYPE_TEXT[t] + '</span>' +
    (isTrials(t) ? '<b>Try ' + Math.min(G.tries.length + 1, Math.max(g.tries, G.tries.length + 1)) + ' <span style="font-size:.9rem;color:#444">of ' + g.tries + '</span></b>' : '') + '</div></div>';
  if (isTrials(t)) {
    const n = Math.max(g.tries, G.tries.length);
    html += '<div class="strip" style="grid-template-columns:repeat(' + Math.min(10, n) + ', minmax(0,1fr))">';
    for (let i = 0; i < n; i++) {
      const x = G.tries[i];
      if (!x) html += '<i class="' + (i === G.tries.length ? "next" : "") + '"></i>';
      else if (!x.ok) html += '<i class="no">✗</i>';
      else if (x.h && x.h !== "I") html += '<i class="help">✓</i>';
      else html += '<i class="ok">✓</i>';
    }
    html += '</div>';
  }
  if (t === "correct" || t === "correcthelp") {
    if (t === "correcthelp") {
      html += '<div class="help-label">How much help did you give?</div><div class="helps" id="helps">' +
        HELP.map(h => '<button data-h="' + h[0] + '" aria-pressed="' + (G.help === h[0]) + '">' + h[1] + '</button>').join("") + '</div>';
    }
    html += '<div class="ans"><button class="yes" data-t="ok"><span class="big-mark">✓</span><span class="lab">Got it</span></button><button class="no" data-t="no"><span class="big-mark">✗</span><span class="lab">Not yet</span></button></div>';
  } else if (t === "help") {
    html += '<div class="help-label">Tap how much help you gave for this try</div><div class="helps big" id="helps">' +
      HELP.map(h => '<button data-h="' + h[0] + '" data-tap="1">' + h[1] + '</button>').join("") + '</div>';
  } else if (t === "yesno") {
    html += '<div class="ans"><button class="yes" data-t="ok"><span class="big-mark">✓</span><span class="lab">Yes</span></button><button class="no" data-t="no"><span class="big-mark">✗</span><span class="lab">No</span></button></div>';
  } else if (t === "count") {
    html += '<div class="counter"><button class="pm minus" data-c="-1" aria-label="Take one away">−</button><div class="num">' + G.n + '</div><button class="pm plus" data-c="1" aria-label="Add one">+</button></div>';
  } else if (t === "duration") {
    const x = secsNow();
    html += '<div class="clock"><div class="num" id="clockNum">' + mmss(x) + '</div><button class="big ' + (G.running ? "stop-btn" : "go-btn") + '" data-clock="1">' + (G.running ? "Stop" : (x ? "Keep going" : "Start")) + '</button></div>';
  }
  if (isTrials(t) && G.tries.length) {
    const got = G.tries.filter(x => x.ok).length, alone = G.tries.filter(x => x.ok && (!x.h || x.h === "I")).length;
    const pct = v => Math.round(v / G.tries.length * 100) + "%";
    html += '<div class="stats"><div><b>' + pct(got) + '</b><span>Got it</span></div>' +
      (t === "correcthelp" || t === "help" ? '<div><b>' + pct(alone) + '</b><span>No help</span></div>' : '<div></div>') +
      '<div><b>' + G.tries.length + '</b><span>Tries done</span></div></div>';
  }
  body.innerHTML = html;
  body.querySelector(".g-name").textContent = g.goal;
  $("btnFinish").disabled = !(G.tries.length || G.n > 0 || G.running || secsNow() > 0);
  $("btnUndo").disabled = !(G.tries.length || G.n > 0 || (!G.running && G.baseSecs > 0));
}

$("goalBody").addEventListener("click", e => {
  if (!G) return;
  const b = e.target.closest("button"); if (!b) return;
  const t = G.g.type;
  if (b.dataset.h && !b.dataset.tap) { G.help = b.dataset.h; renderGoal(); return; }
  if (b.dataset.tap) { G.tries.push({ ok: b.dataset.h === "I", h: b.dataset.h }); }
  else if (b.dataset.t) {
    const ok = b.dataset.t === "ok";
    G.tries.push({ ok, h: t === "correcthelp" ? G.help : "" });
    G.help = "I"; // next try starts at "None"
  }
  else if (b.dataset.c) { G.n = Math.max(0, Math.min(999, G.n + Number(b.dataset.c))); }
  else if (b.dataset.clock) {
    if (G.running) { G.baseSecs = secsNow(); G.running = false; clearInterval(G.tick); }
    else { G.running = true; G.startMs = Date.now(); G.tick = setInterval(() => { const el = $("clockNum"); if (el) el.textContent = mmss(secsNow()); }, 500); }
  } else return;
  if (navigator.vibrate) navigator.vibrate(15);
  renderGoal();
});

$("btnUndo").addEventListener("click", () => {
  if (!G) return;
  if (isTrials(G.g.type)) G.tries.pop();
  else if (G.g.type === "count") G.n = Math.max(0, G.n - 1);
  else if (G.g.type === "duration" && !G.running) G.baseSecs = 0;
  renderGoal();
});

function saveGoal(s, g, tries, n){
  enqueue({ action: "goal", by: store.get("parachute:by") || "", item: JSON.stringify({ s: s.initials, g: g.goal, type: g.type, tries, n }) });
}

$("btnFinish").addEventListener("click", () => {
  if (!G) return;
  if (G.running) { G.baseSecs = secsNow(); G.running = false; clearInterval(G.tick); }
  const n = G.g.type === "duration" ? G.baseSecs : G.n;
  saveGoal(current, G.g, isTrials(G.g.type) ? G.tries : [], n);
  const s = current;
  G = null;
  openGoalList(s);
  toast("✓ Saved for " + s.initials, true);
  if (navigator.vibrate) navigator.vibrate(40);
});

function leaveGoal(){
  if (goalHasData() && !confirm("Throw away this data? It hasn't been saved. Tap Finish & save to keep it.")) return;
  if (G && G.tick) clearInterval(G.tick);
  const s = current; G = null;
  openGoalList(s);
}

/* ---------- outbox: entries saved on the phone until the Sheet confirms them ---------- */
const OUTBOX_KEY = "parachute:outbox";
const NO_RETRY = ["bad-data", "bad-time", "future-time"]; // the Sheet will never accept these
function readOutbox(){ try { return JSON.parse(store.get(OUTBOX_KEY) || "[]"); } catch { return []; } }
function writeOutbox(box){ store.set(OUTBOX_KEY, JSON.stringify(box)); renderPending(); }

function enqueue(params){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const box = readOutbox();
  box.push({ id, params: { ...params, id, ent: Date.now() }, tries: 0, next: 0, since: Date.now() });
  writeOutbox(box);
  sendOutbox();
}

let sending = false, retryTimer = null;
async function sendOutbox(){
  if (sending) return;
  sending = true;
  clearTimeout(retryTimer);
  try {
    for (;;) {
      const box = readOutbox();
      const item = box.find(e => e.next <= Date.now());
      if (!item) break;
      try {
        await request(item.params);
        writeOutbox(readOutbox().filter(e => e.id !== item.id));
      } catch (err) {
        if (NO_RETRY.includes(err.message)) {
          writeOutbox(readOutbox().filter(e => e.id !== item.id));
          toast("One entry couldn't be saved (" + (err.message === "future-time" ? "time later than now" : err.message) + "). Please enter it again.");
          continue;
        }
        // Try again later: 5s, 15s, 30s, then every minute
        const latest = readOutbox();
        const e = latest.find(x => x.id === item.id);
        if (e) { e.tries++; e.next = Date.now() + ([5000, 15000, 30000][e.tries - 1] || 60000); writeOutbox(latest); }
        break;
      }
    }
  } finally {
    sending = false;
    const box = readOutbox();
    if (box.length) {
      const wait = Math.max(1000, Math.min(...box.map(e => e.next)) - Date.now());
      retryTimer = setTimeout(sendOutbox, wait);
    }
  }
}

function renderPending(){
  const box = readOutbox();
  const chip = $("pendingChip");
  chip.hidden = box.length === 0;
  if (!box.length) return;
  const stuck = box.some(e => Date.now() - e.since > 60000);
  chip.classList.toggle("stuck", stuck);
  chip.textContent = (stuck ? "⚠ " : "⏳ ") + box.length + (stuck ? " waiting to send" : " sending");
}

let toastTimer;
function toast(text, home){
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("home", !!home);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), text.startsWith("Not saved") ? 6000 : 2500);
}

/* ---------- who is using this phone ---------- */
function setWho(by){
  store.set("parachute:by", by);
  $("btnWho").textContent = by;
  goLaunch();
}
// Staff names come from the Sheet's Staff tab
function renderStaff(){
  const list = $("staffList");
  list.innerHTML = "";
  staff.forEach(name => {
    const b = document.createElement("button");
    b.className = "big";
    b.textContent = name;
    b.addEventListener("click", () => setWho(name));
    list.appendChild(b);
  });
  $("staffMsg").hidden = staff.length > 0;
  $("staffMsg").textContent = "Loading names…";
}
$("btnWho").addEventListener("click", () => show("screenWho"));

$("btnBack").addEventListener("click", () => {
  if (screenNow === "screenStudents") goLaunch();
  else if (screenNow === "screenBehaviors") leave();
  else if (screenNow === "screenGoalList") goGoalStudents();
  else if (screenNow === "screenGoal") leaveGoal();
});
$("tileGoals").addEventListener("click", goGoalStudents);
$("tileBehavior").addEventListener("click", goHome);
$("btnCancel").addEventListener("click", leave);
$("btnSubmit").addEventListener("click", submit);
// Opening the app, coming back to it, regaining signal, or tapping the chip all mean "try now"
function retryNow(){
  const box = readOutbox();
  if (!box.length) return;
  box.forEach(e => e.next = 0);
  writeOutbox(box);
  sendOutbox();
}
$("pendingChip").addEventListener("click", retryNow);
window.addEventListener("online", retryNow);
setInterval(() => { renderPending(); sendOutbox(); }, 20000);
$("whenInput").addEventListener("change", () => document.querySelector(".when").classList.add("edited"));
$("modeCount").addEventListener("click", () => setMode("count"));
$("modeTime").addEventListener("click", () => setMode("min"));
window.addEventListener("beforeunload", e => { if (pendingItems().length || goalHasData()) { e.preventDefault(); e.returnValue = ""; } });

// Start: show cached students instantly, then refresh from the Sheet
const by = store.get("parachute:by");
if (by) { $("btnWho").textContent = by; goLaunch(); } else { show("screenWho"); }
renderStudents();
renderStaff();
loadStudents();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  retryNow();
  if (!current) loadStudents();
});
renderPending();
retryNow();
</script>
</body>
